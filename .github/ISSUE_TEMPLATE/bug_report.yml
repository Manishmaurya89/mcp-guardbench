name: Bug report
description: Something in the lab itself is broken (not a missed/false detection; see the other template).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: this is a **local security lab**. If a reference control missed an attack or
        flagged a benign case, that's expected and tracked in [docs/limitations.md](../../docs/limitations.md),
        not a bug; use the "Detection result" template instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands (`guardbench ...`, `make ...`). A failing test is even better.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste error output here. Please double-check it doesn't contain a real secret or API key before posting. Synthetic markers like `TEST_SECRET_123` are fine.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `guardbench --version`, plus your OS and Python version.
    validations:
      required: true
