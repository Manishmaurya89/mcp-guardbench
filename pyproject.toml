[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-guardbench"
version = "0.1.0"
description = "An evidence-based benchmark and runtime evaluation framework for secure Model Context Protocol tool-using agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "MCP-GuardBench contributors" }]
keywords = ["mcp", "model-context-protocol", "security", "benchmark", "agents", "tool-poisoning", "rug-pull", "scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.31",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "typer>=0.16",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "mcp>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/Manishmaurya89/mcp-guardbench"
Repository = "https://github.com/Manishmaurya89/mcp-guardbench"
Issues = "https://github.com/Manishmaurya89/mcp-guardbench/issues"
Changelog = "https://github.com/Manishmaurya89/mcp-guardbench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
# Embedded PostgreSQL for running the tests against a real Postgres without Docker.
pgtest = ["pgserver>=0.1.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.20",
]

[project.scripts]
guardbench = "guardbench.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/guardbench"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "security: security-property tests (network isolation, redaction, deny-by-default)",
    "integration: tests that exercise several layers together",
]
filterwarnings = ["error::DeprecationWarning:guardbench.*"]

[tool.coverage.run]
source = ["guardbench"]
branch = true
omit = ["src/guardbench/dashboard/*", "src/guardbench/mcp_lab/server_runner.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT", "T20"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "B008",   # FastAPI Depends() in defaults is the idiomatic pattern
    "RUF012", # pydantic/SQLAlchemy class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "T20", "PT018"]
"src/guardbench/cli/**" = ["T20"]
"scripts/**" = ["T20"]
"src/guardbench/mcp_lab/**" = ["S608"]
# Names like SECRET/NO_REAL_SECRET are labels for synthetic markers, not credentials.
"src/guardbench/domain/enums.py" = ["S105"]
"src/guardbench/domain/markers.py" = ["S105"]
# The report renderer is mostly prose templates; wrapping them would hurt readability.
"src/guardbench/benchmark/report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "alembic.*"]
ignore_missing_imports = true
